[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhands-traceability"
version = "0.2.4"
description = "OpenHands context and command adapter for versioned-traceability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["versioned-traceability==0.4.3", "openhands-sdk>=1.46,<1.49"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
